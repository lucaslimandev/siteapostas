<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1018">
<meta name="description" content="Gestão de banca para trade esportivo — operações, ciclos, métodos e relatórios de disciplina.">
<title>Banca — Gestão de trade esportivo</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Archivo:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#0A1018}
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0A1018;z-index:9999}
  #boot .mark{width:72px;height:72px;animation:boot-float 2.2s ease-in-out infinite}
  #boot .bar{transform-origin:bottom;animation:boot-bar 1.4s ease-in-out infinite}
  #boot .bar1{animation-delay:0s} #boot .bar2{animation-delay:.12s} #boot .bar3{animation-delay:.24s}
  @keyframes boot-bar{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}
  @keyframes boot-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  #boot.hide{opacity:0;pointer-events:none;transition:opacity .35s ease}
  @media (prefers-reduced-motion:reduce){#boot .mark,#boot .bar{animation:none}}
</style>
</head>
<body>
<div id="boot" aria-hidden="true">
  <svg class="mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="bootG" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0" stop-color="#F5B841"/>
        <stop offset="1" stop-color="#3DDC97"/>
      </linearGradient>
    </defs>
    <rect x="1" y="1" width="62" height="62" rx="18" fill="#121B28" stroke="rgba(255,255,255,.09)"/>
    <g fill="url(#bootG)">
      <rect class="bar bar1" x="16" y="30" width="9" height="20" rx="2.5"/>
      <rect class="bar bar2" x="27.5" y="20" width="9" height="30" rx="2.5"/>
      <rect class="bar bar3" x="39" y="12" width="9" height="38" rx="2.5"/>
    </g>
  </svg>
</div>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
